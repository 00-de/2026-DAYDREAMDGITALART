# ============================================================================
#  自動ビルド・自動バージョンアップ・自動公開
#
#  GitHub Desktop で「Push origin」するたびに、GitHub のクラウド上にある
#  まっさらな Windows パソコンで次の作業を自動で行います（約10分）。
#
#   1. 自動テスト
#   2. バージョン番号を自動で1つ上げる（例：0.2.14 → 0.2.15）
#   3. Python 不要の EXE にまとめ、自己診断
#   4. セットアップEXE（DayDreamPlusDigitalMosaic_Setup.exe）を作成
#   5. インストール → 起動・自己診断 → アンインストール を実際に検証
#   6. すべて合格したときだけ「Releases」に公開
#      → インストール済みのアプリが次回起動時に新しい版を見つけて更新できる
#
#  説明文（.md / .txt）だけの変更では動きません（無駄に版が上がらないように）。
# ============================================================================
name: ビルドと公開

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "README.txt"
      - "TEST_RESULTS.md"
  workflow_dispatch:

permissions:
  contents: write   # Releases に公開するため

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      APP: DayDreamPlusDigitalMosaic
    defaults:
      run:
        shell: pwsh

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: 必要な部品をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: ① 自動テスト
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmd /c "python -m unittest discover -s tests -v > test_output.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content test_output.txt -Encoding utf8
          if ($code -ne 0) {
            # 失敗の理由を、ログインしなくても見られる「Summary」欄に書き出す
            $tail = (Get-Content test_output.txt -Encoding utf8 -Tail 120) -join "`n"
            "## ❌ 自動テストで失敗しました`n``````text`n$tail`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw "自動テストに失敗しました"
          }

      - name: ② バージョン番号を決める
        run: |
          $base = python -c "from app.version import BASE_VERSION; print(BASE_VERSION)"
          $version = "$base.${{ github.run_number }}"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python tools/write_build_info.py $version ${{ github.repository }}
          Write-Host "今回のバージョン: $version"

      - name: ③ EXE を作成
        run: pyinstaller --noconfirm --clean "$env:APP.spec"

      - name: ③ EXE の自己診断
        run: |
          $exe = "dist\$env:APP\$env:APP.exe"
          $out = "$pwd\selftest_exe.json"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out -Encoding utf8 }
          if ($p.ExitCode -ne 0) {
            $detail = if (Test-Path $out) { (Get-Content $out -Encoding utf8) -join "`n" } else { "結果ファイルなし" }
            "## ❌ EXE の自己診断に失敗しました`n``````json`n$detail`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw "EXE の自己診断に失敗しました（終了コード $($p.ExitCode)）"
          }

      - name: ④ セットアップEXE を作成
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" "installer\$env:APP.iss"
          if ($LASTEXITCODE -ne 0) { throw "インストーラーの作成に失敗しました" }
          $setup = "dist_installer\${env:APP}_Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  ${env:APP}_Setup.exe" | Out-File -FilePath "$setup.sha256" -Encoding ascii -NoNewline
          Write-Host ("サイズ: {0:N1} MB  SHA256: {1}" -f ((Get-Item $setup).Length / 1MB), $hash)

      - name: ⑤ インストール → 起動 → アンインストールの検証
        run: |
          $setup = "dist_installer\${env:APP}_Setup.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NORELAUNCH=1", "/TASKS=desktopicon", "/LOG=`"$pwd\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "インストールに失敗しました（終了コード $($p.ExitCode)）" }

          $dir = "$env:LOCALAPPDATA\Programs\$env:APP"
          $exe = "$dir\$env:APP.exe"
          if (-not (Test-Path $exe)) { throw "インストール先にアプリがありません: $exe" }
          Write-Host "インストール先: $dir"

          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "*.lnk" -Recurse | Where-Object { $_.Name -like "DayDream Plus*" }
          if (-not $lnk) { throw "スタートメニューに登録されていません" }
          Write-Host "スタートメニュー: $($lnk.FullName)"

          $out = "$pwd\selftest_installed.json"
          $p = Start-Process $exe -ArgumentList "--self-test", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) {
            Get-Content $out -Encoding utf8
            # 自己診断の結果（MP4 の圧縮方式など）を毎回 Summary 欄に残す
            "## インストール後の自己診断`n``````json`n$((Get-Content $out -Encoding utf8) -join "`n")`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($p.ExitCode -ne 0) {
            $detail = if (Test-Path $out) { (Get-Content $out -Encoding utf8) -join "`n" } else { "結果ファイルなし" }
            "## ❌ インストール後の自己診断に失敗しました`n``````json`n$detail`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw "インストール後の自己診断に失敗しました"
          }

          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "アンインストール後もアプリが残っています" }
          Write-Host "インストール・起動・アンインストールの検証に合格しました"

      - name: 成果物を保存（検証ログつき）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ env.VERSION }}
          path: |
            dist_installer/*
            selftest_*.json
            install.log
            test_output.txt
          if-no-files-found: ignore

      - name: ⑥ Releases に公開（自動更新の配信）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = git log -1 --pretty=%B
          $body = "## 変更内容`n$notes`n`n---`nインストール：DayDreamPlusDigitalMosaic_Setup.exe をダウンロードしてダブルクリック`nインストール済みの方：アプリを起動すると自動で更新のお知らせが出ます"
          $body | Out-File notes.md -Encoding utf8
          gh release create "v$env:VERSION" `
            "dist_installer\${env:APP}_Setup.exe" `
            "dist_installer\${env:APP}_Setup.exe.sha256" `
            --title "ver $env:VERSION" --notes-file notes.md --target $env:GITHUB_SHA
